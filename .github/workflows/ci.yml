name: CI

# Integración continua: se ejecuta en cada push y cada pull request contra
# la rama principal, validando que el código, las pruebas y la imagen de
# contenedor sigan siendo válidos antes de fusionar cambios.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model (needed for tests that load the artifact)
        run: python train.py

      - name: Run functional tests
        run: pytest test_app.py -v

      - name: Run maintenance / CI pipeline tests
        run: pytest test_maintenance_ci.py -v

      - name: Upload test model artifact (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: model-debug
          path: model/

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push — validates the Dockerfile builds cleanly)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: cardio-risk-app:ci
  deploy:
    name: Deploy to Cloud Ubuntu Server
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /root/projects/card-risk
            
            git fetch origin main
            git reset --hard origin/main
            
            docker compose down
            docker compose up -d --build
            
            docker image prune -f
