services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cardio-risk-app:latest
    container_name: cardio-risk-app
    ports:
      - "8501:8501"
    environment:
      - PORT=8501
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
